[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "depth-video-converter"
version = "0.1.0"
description = "Convert ordinary videos into relative depth-map videos."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "gradio[mcp]>=6.0,<7",
    "numpy>=2.0,<3",
    "opencv-python>=4.10,<5",
    "pillow>=10,<13",
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=4.45,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[project.scripts]
depth-video = "depth_video_converter.cli:main"
depth-video-ui = "depth_video_converter.ui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

